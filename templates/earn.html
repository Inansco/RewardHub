<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Earn - RewardHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav>

        <div class="logo">
            RewardHub
        </div>

        <div class="nav-links">

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('earn') }}">
                Earn
            </a>

            <a href="{{ url_for('rewards') }}">
                Rewards
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </nav>


    <main class="dashboard">

        <div class="dashboard-header">

            <h1>Earn Points</h1>

            <p>
                Complete activities and increase your balance.
            </p>

        </div>


        <div class="task-container">

            {% for task in tasks %}

            <div class="task-card">

                <div>

                    <h2>
                        {{ task["title"] }}
                    </h2>

                    <p>
                        {{ task["description"] }}
                    </p>

                </div>

                <div class="task-reward">

                    <strong>
                        +{{ task["points"] }}
                    </strong>

                    <span>
                        Points
                    </span>

                    <a href="{{ url_for('complete_task', task_id=task['id']) }}">
                        Start
                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

    </main>

</body>

</html>
